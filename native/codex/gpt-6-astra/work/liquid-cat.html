<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f5ee">
<title>Cats are liquid — a small experiment</title>
<style>
  :root{color-scheme:light;--paper:#f8f5ee;--ink:#34312f;--muted:#8a847b;--purple:#786491;--line:#e5dfd4}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:36px 28px}
  main{width:min(1100px,100%)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px;font-size:11px;letter-spacing:2px;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.brand svg{width:24px;height:24px}.edition{color:var(--muted)}
  .intro{text-align:center;margin:48px 0 0}.eyebrow{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:var(--purple)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(40px,6vw,67px);letter-spacing:-2.5px;line-height:1.1;margin:14px 0 13px}h1 em{color:var(--purple);font-weight:400}.subtitle{font-size:14px;color:var(--muted);line-height:1.6;margin:0}
  .stage{position:relative;margin:0 -10px}.stage>svg{display:block;width:100%;height:auto;overflow:visible}.svg-note{font-family:'Trebuchet MS',sans-serif;font-size:11px;letter-spacing:1.5px;fill:#999083}.svg-hand{font-family:Georgia,serif;font-size:18px;font-style:italic;fill:#93859d}.cat-outline{stroke:#794724;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.face-line{fill:none;stroke:#613b29;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}
  .caption{display:flex;justify-content:center;align-items:center;gap:10px;height:28px;margin-top:-12px;font-size:13px;color:#706776}.dot{width:6px;height:6px;background:#a18ab6;border-radius:50%}.controls{border-top:1px solid var(--line);margin-top:26px;padding-top:23px;display:flex;align-items:center;justify-content:space-between;gap:24px}.buttons{display:flex;gap:9px;align-items:center}button{cursor:pointer;font:inherit;border:1px solid #dcd5c9;background:transparent;color:var(--ink);height:39px;border-radius:100px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}button:hover{background:#ece6dc}button:focus-visible,input:focus-visible{outline:3px solid #a18ab6;outline-offset:4px}button svg{width:13px;height:13px}.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:92px;justify-content:center}.primary:hover{background:#51494e}.scrubber{display:flex;gap:13px;align-items:center;max-width:340px;flex:1}input[type=range]{width:100%;accent-color:var(--purple);height:3px;cursor:pointer}.time{font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);white-space:nowrap}.speed{min-width:67px;justify-content:center}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:27px;color:#a29b91;font-size:10px;letter-spacing:.4px}.foot i{font-family:Georgia,serif;font-size:13px} .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:600px){body{padding:24px 17px}.edition{font-size:9px;letter-spacing:1px}.intro{margin-top:35px}h1{letter-spacing:-1.7px}.subtitle{font-size:12px}.stage{margin:15px -15px 0}.caption{font-size:11px;margin-top:0}.controls{flex-wrap:wrap;gap:18px;margin-top:20px}.scrubber{order:3;flex-basis:100%;max-width:none}.foot{font-size:9px;margin-top:22px}.foot span:last-child{display:none}}
</style>
</head>
<body>
<main>
  <header><span class="brand"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 13 4 4l7 5h6l7-5-1 9c5 14-23 14-18 0Z" stroke="currentColor" stroke-width="1.6"/><path d="M10 16h.1m8-.1h.1M13 20h2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg> Small wonders lab</span><span class="edition">Experiment № 001</span></header>
  <div class="intro"><span class="eyebrow">An entirely unscientific study</span><h1>Cats are <em>liquid.</em></h1><p class="subtitle">One cat. One impossibly small tube. Zero respect for physics.</p></div>
  <div class="stage">
  <svg id="scene" viewBox="0 75 1000 395" role="img" aria-labelledby="sceneTitle sceneDesc">
    <title id="sceneTitle">A liquid cartoon cat</title><desc id="sceneDesc">An orange cat melts into a puddle, squeezes through a narrow transparent tube, and becomes a cat again on the other side. The animation repeats.</desc>
    <defs>
      <linearGradient id="fur" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#ffd38b"/><stop offset="1" stop-color="#eea55e"/></linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7ceea" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#b6a2cd" stop-opacity=".20"/></linearGradient>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#b4aaa1" opacity=".25"/></pattern>
      <filter id="soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
      <path id="tubePath" d="M335 339 H401 Q432 339 432 308 V251 Q432 221 462 221 H528 Q558 221 558 251 V308 Q558 339 588 339 H685"/>
      <path id="travelPath" d="M220 377 C270 383 303 365 335 339 H401 Q432 339 432 308 V251 Q432 221 462 221 H528 Q558 221 558 251 V308 Q558 339 588 339 H685 C725 339 741 376 790 377"/>
      <g id="faceDrawing">
        <g class="face-line"><path d="M-26 -5q6 -7 12 0m28 0q6 -7 12 0"/><path d="M0 6v5m0 0q-6 8-12 1m12-1q6 8 12 1" stroke-width="2.5"/></g>
        <path d="M-4 4Q0 1 4 4L0 8Z" fill="#a35c4e"/>
        <g stroke="#996044" stroke-width="1.6" stroke-linecap="round"><path d="M-35 4-49 1m15 10-15 3M35 4 49 1M34 11l15 3"/></g>
        <ellipse cx="-27" cy="8" rx="7" ry="3.7" fill="#eb906f" opacity=".5"/><ellipse cx="27" cy="8" rx="7" ry="3.7" fill="#eb906f" opacity=".5"/>
      </g>
    </defs>
    <rect x="90" y="126" width="820" height="278" fill="url(#grid)" opacity=".75"/>
    <path d="M95 401H905" stroke="#ddd5c9" stroke-width="1.3"/>
    <ellipse id="shadowLeft" cx="220" cy="397" rx="79" ry="8" fill="#b7a998" opacity=".19" filter="url(#soft)"/>
    <ellipse id="shadowRight" cx="790" cy="397" rx="79" ry="8" fill="#b7a998" opacity="0" filter="url(#soft)"/>
    <g fill="none" stroke="#c8bfcf" stroke-width="2"><path d="M472 401v-95q0-7 7-7h32q7 0 7 7v95"/><path d="M457 401h76" stroke-width="4" stroke-linecap="round"/></g>
    <g opacity=".9"><use href="#tubePath" fill="none" stroke="#ad9bbb" stroke-width="49" stroke-linecap="butt"/><use href="#tubePath" fill="none" stroke="#f1edf4" stroke-width="44" stroke-linecap="butt"/><use href="#tubePath" fill="none" stroke="#fffdf9" stroke-width="36" stroke-linecap="butt"/></g>
    <g id="actors">
      <g id="leftCat"><path id="leftTail" class="cat-outline" fill="none" stroke-width="17" d="M-49-13C-101-5-119-46-102-69C-92-84-78-70-88-61"/><path id="leftBody" class="cat-outline" fill="url(#fur)"/><g id="leftDetails"><path d="M-44-116-41-98-28-108M44-116 41-98 28-108" fill="#dc9273"/><path d="M-12-114l5 13M0-116v14M12-114l-5 13" stroke="#c98249" stroke-width="4" stroke-linecap="round"/><ellipse cx="0" cy="-31" rx="29" ry="29" fill="#ffdfaa"/><g class="face-line" stroke-width="2"><path d="M-24-29-26-4q12 7 21 0m29-25L26-4Q14 3 5-4"/><path d="M-42-54l10 4m-13 5 10 4M42-54l-10 4m13 5-10 4" stroke="#c98249"/></g></g><g id="leftFace"><use href="#faceDrawing"/></g></g>
      <path id="flowOutline" fill="none" stroke="#94552d" stroke-width="28" stroke-linecap="round"/>
      <path id="flow" fill="none" stroke="#f6b96f" stroke-width="23" stroke-linecap="round"/>
      <path id="flowShine" fill="none" stroke="#ffdc9b" stroke-width="5" stroke-linecap="round" opacity=".7"/>
      <g id="movingFace"><ellipse rx="22" ry="13" fill="#f6b96f"/><use href="#faceDrawing" transform="scale(.47 .6) translate(0 -3)"/></g>
      <g id="rightCat"><path id="rightTail" class="cat-outline" fill="none" stroke-width="17" d="M49-13C101-5 119-46 102-69C92-84 78-70 88-61"/><path id="rightBody" class="cat-outline" fill="url(#fur)"/><g id="rightDetails"><path d="M-44-116-41-98-28-108M44-116 41-98 28-108" fill="#dc9273"/><path d="M-12-114l5 13M0-116v14M12-114l-5 13" stroke="#c98249" stroke-width="4" stroke-linecap="round"/><ellipse cx="0" cy="-31" rx="29" ry="29" fill="#ffdfaa"/><g class="face-line" stroke-width="2"><path d="M-24-29-26-4q12 7 21 0m29-25L26-4Q14 3 5-4"/><path d="M-42-54l10 4m-13 5 10 4M42-54l-10 4m13 5-10 4" stroke="#c98249"/></g></g><g id="rightFace"><use href="#faceDrawing"/></g></g>
    </g>
    <g pointer-events="none"><use href="#tubePath" fill="none" stroke="url(#glass)" stroke-width="41"/><path d="M345 323H400Q416 323 416 307V251Q416 205 462 205H528Q574 205 574 251V307Q574 323 589 323H675" fill="none" stroke="white" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/><ellipse cx="335" cy="339" rx="7" ry="25" fill="none" stroke="#aa96b9" stroke-width="2.5"/><path d="M332 318q-8 20 0 39" fill="none" stroke="white" stroke-width="2"/><ellipse cx="685" cy="339" rx="7" ry="25" fill="none" stroke="#aa96b9" stroke-width="2.5"/></g>
    <g id="sparkles" fill="none" stroke="#b99c6c" stroke-width="2" stroke-linecap="round"><path d="M884 235v14m-7-7h14M708 260v10m-5-5h10M861 211v7m-3.5-3.5h7"/></g>
    <g><text x="497" y="150" text-anchor="middle" class="svg-hand">if I fits, I flows.</text><path d="M529 160q32 5 30 30m-5-7 5 8 6-6" fill="none" stroke="#aa9ab6" stroke-width="1.3" stroke-linecap="round"/></g>
    <text x="220" y="438" text-anchor="middle" class="svg-note">01 / CAT</text><text x="495" y="438" text-anchor="middle" class="svg-note">02 / CAT, BUT LONG</text><text x="790" y="438" text-anchor="middle" class="svg-note">03 / STILL CAT</text>
  </svg>
  </div>
  <div class="caption"><span class="dot"></span><span id="caption">A perfectly ordinary cat. For now.</span></div>
  <div class="controls">
    <div class="buttons"><button class="primary" id="play" aria-label="Pause animation"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2"/></svg><span id="playText">Pause</span></button><button id="replay" aria-label="Replay animation"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6a5 5 0 1 1 0 5M3 2v4h4"/></svg>Replay</button></div>
    <label class="scrubber"><span class="sr-only">Animation position</span><input id="scrub" type="range" min="0" max="13" step=".01" value="0"><span class="time" id="time">0:00 / 0:13</span></label>
    <button id="speed" aria-label="Playback speed: 1 times. Click to change.">1× speed</button>
  </div>
  <div class="foot"><span>100% cat. &nbsp; 0% solid commitment.</span><span><i>Made of curves, curiosity & a little nonsense.</i></span></div>
  <noscript><p>Enable JavaScript to watch the cat flow through the tube.</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { x=clamp(x); return x*x*(3-2*x); };
  const phase = (t,a,b) => ease((t-a)/(b-a));
  const lerp = (a,b,t) => a+(b-a)*t;
  const attr = (id,k,v) => $(id).setAttribute(k,v);
  const opacity = (id,v) => attr(id,'opacity',clamp(v));
  const cat = [[-59,0],[-68,-23],[-62,-49],[-47,-65],[-49,-94],[-51,-130],[-24,-113],[0,-118],[24,-113],[51,-130],[49,-94],[47,-65],[62,-49],[68,-23],[59,0],[28,5],[0,3],[-28,5]];
  const puddle = [[-90,0],[-108,-6],[-102,-13],[-83,-18],[-63,-21],[-44,-22],[-25,-21],[0,-23],[25,-21],[44,-22],[63,-21],[83,-18],[102,-13],[108,-6],[90,0],[45,6],[0,8],[-45,6]];
  // Interpolate one continuous outline: the ears and body themselves become the puddle.
  function outline(melt,t) {
    const p=cat.map((v,i)=>[lerp(v[0],puddle[i][0],melt),lerp(v[1],puddle[i][1],melt)+Math.sin(i*1.8+t*4)*1.6*melt]);
    let d=`M${p[0][0]},${p[0][1]}`;
    for(let i=0;i<p.length;i++) {
      const a=p[(i+p.length-1)%p.length],b=p[i],c=p[(i+1)%p.length],e=p[(i+2)%p.length];
      const k=(i===4||i===5||i===8||i===9)?lerp(.045,.16,melt):.16;
      d+=`C${b[0]+(c[0]-a[0])*k},${b[1]+(c[1]-a[1])*k} ${c[0]-(e[0]-b[0])*k},${c[1]-(e[1]-b[1])*k} ${c[0]},${c[1]}`;
    }
    return d+'Z';
  }
  function drawCat(side,x,melt,size,t,faceAlpha=1,wobble=0) {
    const s=Math.max(.001,size),sx=s*(1+wobble),sy=s/(1+wobble);
    attr(side+'Cat','transform',`translate(${x} 386) scale(${sx} ${sy})`);
    opacity(side+'Cat',size<.015?0:1);
    attr(side+'Body','d',outline(melt,t));
    attr(side+'Tail','transform',`translate(0 ${-2*Math.sin(t*3)*(1-melt)}) scale(1 ${Math.max(.04,1-melt)})`);
    opacity(side+'Tail',1-phase(melt,.15,.9));
    attr(side+'Details','transform',`scale(1 ${1-melt*.85})`);
    opacity(side+'Details',1-phase(melt,0,.65));
    const blink= Math.pow(Math.max(0,Math.cos((t-.6)*2.8)),28);
    attr(side+'Face','transform',`translate(0 ${lerp(-85,-14,melt)}) scale(${lerp(1,1.18,melt)} ${lerp(1,.46,melt)*(1-.12*blink)})`);
    opacity(side+'Face',faceAlpha);
  }
  const route=$('travelPath'),length=route.getTotalLength();
  // Cache the centerline for fluid geometry; only the front and tail need exact samples.
  const samples=Array.from({length:Math.ceil(length/4)+1},(_,i)=>{const d=Math.min(length,i*4),p=route.getPointAtLength(d);return {d,x:p.x,y:p.y};});
  function liquid(a,b,t) {
    const visible=b-a>.5;
    for(const id of ['flow','flowOutline','flowShine']) opacity(id,visible?(id==='flowShine'?.65:1):0);
    if(!visible)return;
    const start=route.getPointAtLength(a),end=route.getPointAtLength(b);
    let d=`M${start.x},${start.y}`;
    for(const p of samples)if(p.d>a&&p.d<b)d+=`L${p.x},${p.y}`;
    d+=`L${end.x},${end.y}`;
    for(const id of ['flow','flowOutline','flowShine'])attr(id,'d',d);
    attr('flowShine','transform','translate(0 -5)');
    attr('flow','stroke-width',23+Math.sin(t*9)*.7);
  }
  const captions=['A perfectly ordinary cat. For now.','Initiating puddle mode…','Bones? A completely optional feature.','Please enjoy this long, uninterrupted cat.','Reassembling the original loaf…','Same cat. Slightly more fluid worldview.'];
  let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=null;
  function render(t) {
    const melt=phase(t,1.1,2.7),drain=phase(t,2.75,4.75),fill=phase(t,6.1,8.25),rise=phase(t,8.25,9.6);
    const settle=t>9.6?Math.sin((t-9.6)*12)*Math.exp(-(t-9.6)*3)*.085:0;
    drawCat('left',220,melt,Math.sqrt(1-drain),t,1-phase(t,2.6,2.95));
    drawCat('right',790,1-rise,Math.sqrt(fill),t,phase(t,6.7,7.2),settle);
    opacity('shadowLeft',.19*(1-drain));opacity('shadowRight',.19*fill);
    const front=length*phase(t,2.65,6.8),back=length*phase(t,4.15,8.05);
    liquid(back,front,t);
    const p=route.getPointAtLength(front),p0=route.getPointAtLength(Math.max(0,front-3)),p1=route.getPointAtLength(Math.min(length,front+3));
    let angle=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;
    attr('movingFace','transform',`translate(${p.x} ${p.y}) rotate(${angle*.7})`);
    opacity('movingFace',phase(t,2.6,2.95)*(1-phase(t,6.7,7.1)));
    opacity('sparkles',phase(t,9.5,9.9)*(1-phase(t,11.4,12.1))*(.75+.25*Math.sin(t*5)));
    // A brief soft dissolve resets the loop after the cat has had time to settle.
    const fade=1-phase(t,11.7,12.3);
    opacity('actors',t>12.3?phase(t,12.35,13):fade);
    if(t>12.3){drawCat('left',220,0,1,t);opacity('rightCat',0);opacity('shadowLeft',.19*phase(t,12.35,13));opacity('shadowRight',0);}
    const step=t<1.1?0:t<2.7?1:t<4.2?2:t<6.7?3:t<9.6?4:5;
    $('caption').textContent=t>12.3?captions[0]:captions[step];
    $('scrub').value=t;
    $('time').textContent=`0:${String(Math.min(13,Math.floor(t))).padStart(2,'0')} / 0:13`;
  }
  function updatePlay(){
    $('playText').textContent=playing?'Pause':'Play';
    $('play').setAttribute('aria-label',playing?'Pause animation':'Play animation');
    attr('playIcon','d',playing?'M5 3v10M11 3v10':'M5 3l8 5-8 5Z');
    attr('playIcon','fill',playing?'none':'currentColor');
  }
  $('play').addEventListener('click',()=>{playing=!playing;updatePlay();});
  $('replay').addEventListener('click',()=>{time=0;playing=true;updatePlay();render(time);});
  $('speed').addEventListener('click',()=>{const speeds=[1,.5,1.5,2];speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];$('speed').textContent=speed+'× speed';$('speed').setAttribute('aria-label',`Playback speed: ${speed} times. Click to change.`);});
  $('scrub').addEventListener('input',e=>{time=Number(e.target.value);render(time);});
  document.addEventListener('visibilitychange',()=>{last=null;});
  function tick(now){if(last!==null&&playing&&!document.hidden)time=(time+Math.min((now-last)/1000,.06)*speed)%13;last=now;render(time);requestAnimationFrame(tick);}
  updatePlay();render(0);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
